<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>Geotagger V1</title>
    <style>
    * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
    }

    body {
         overflow: hidden;
    }

    #map {
         height: 100vh;
         height: 100dvh;
    }

    #welcome {
    max-width: 280px;
    text-align: center;
    font-size: 0.9rem;
    }

    button {
    min-height: 44px;
    font-size: 1rem;
    }

    .leaflet-popup-content {
    font-size: 0.95rem;
    text-align: center;
    }

    #welcome, #noData, label, button {
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 6px;
    }
        
    </style>
</head>
<body>
    <div id="map"></div> 

    <div style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;align-items:center;gap:6px;">
        
        <div id="welcome" style="background:white;padding:6px 14px;border-radius:4px;font-family:sans-serif;"></div>

        <button id="closeResult" style="display:none">Close result</button>

        <div id="noData" style="background:white;padding:6px 14px;border-radius:4px;font-family:sans-serif;font-weight:bold;display:none;"></div>
        
        <input type="file" id="imageInput" style="display:none;">
        <label for="imageInput" style="background:white;padding:6px 14px;border-radius:4px;font-family:sans-serif;font-weight:bold;cursor:pointer;min-height:44px;display:flex;align-items:center;">Upload photo</label>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        var isAndroid = /Android/i.test(navigator.userAgent);
        var isFirefox = /Firefox/i.test(navigator.userAgent);

        if (isAndroid && isFirefox) {
            document.getElementById("welcome").textContent = "Welcome! Upload a photo to find where it was taken. ⚠️ Firefox on Android doesn't support location data. Try Chrome or desktop for best results.";
        } else if (isAndroid) {
            document.getElementById("welcome").textContent = "Welcome! Upload a photo to find where it was taken. Tip: choose 'Files' 📁✅ and not 'Camera' 📷❌";
        } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            document.getElementById("welcome").textContent = "Welcome! Upload a photo to find where it was taken. ⚠️ iOS doesn't support location data in browser uploads. Try on desktop for best results.";
        } else {
            document.getElementById("welcome").textContent = "Welcome! Upload a photo to find where it was taken.";
        }

        var fileInput = document.getElementById('imageInput');
        if (/Android/i.test(navigator.userAgent)) {
            fileInput.accept = 'image/*,model/gltf+json';
        } else {
            fileInput.accept = 'image/*';
        }

        var map = L.map('map').setView([0, 0], 2);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: '© Esri'
        }).addTo(map);
 
        var blueIcon = new L.Icon({
         iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
         shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
         iconSize: [25, 41],
         iconAnchor: [12, 41],
         popupAnchor: [1, -34],
         shadowSize: [41, 41]
        });

        var photoMarker;

        async function showImage (input) {

            var image = input.files[0];

            if (!image || !image.type.startsWith('image/')) {
                document.getElementById("noData").style.display = "block";
                document.getElementById("noData").textContent = "Please upload an image file.";
                setTimeout(() => {
                    document.getElementById("noData").style.display = "none";
                }, 3000);
                return;
            }
            
            var photoLatLng = await exifr.gps(image);
            
            if (photoLatLng && photoLatLng.latitude !== null && photoLatLng.longitude !== null) {

                if (photoMarker) map.removeLayer(photoMarker);

                var photoImgSrc = URL.createObjectURL(image);
                var photoImgHtml = '<img src="' + photoImgSrc + '" style="max-width:200px;width:100%;border-radius:4px;margin-top:6px;">';

                async function getPlaceName() {
                    var response = await fetch("https://api.opencagedata.com/geocode/v1/json?q="+encodeURIComponent(photoLatLng.latitude+","+photoLatLng.longitude)+"&key=49b47c25108242779832267ff8062473");
                    var data = await response.json();
                
                    var placeName = data.results.length > 0 ? data.results[0].formatted : "Unknown location";

                    var photoPopup = L.popup().setContent("<center>This photo was taken in " + placeName + ".</center>" + "</br> <center>"+ photoImgHtml + "</center>");

                    photoMarker = L.marker([photoLatLng.latitude, photoLatLng.longitude],{icon:blueIcon}).addTo(map);;

                    map.flyTo([photoLatLng.latitude, photoLatLng.longitude], 13);

                    document.getElementById("closeResult").style.display = "block";

                    document.getElementById("welcome").style.display = "none";

                    map.once("moveend",function(){       
                        photoMarker.bindPopup(photoPopup).openPopup();         
                    });


                }
                getPlaceName();

            }
            else {
                document.getElementById("noData").style.display = "block";
                document.getElementById("noData").textContent = "This photo has no EXIF data."
                setTimeout(() => {
                 document.getElementById("noData").style.display="none";
                 document.getElementById("noData").textContent=null;
                }, 3000);
            }
        }

        document.getElementById("imageInput").addEventListener("change",function(e){showImage(e.target)});

        function onCloseClick() {
            map.removeLayer(photoMarker);
            document.getElementById("closeResult").style.display="none";
            document.getElementById("welcome").style.display="block";
        }

        document.getElementById("closeResult").addEventListener("click",onCloseClick);

    </script>
    
</body>
</html>
