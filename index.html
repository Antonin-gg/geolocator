<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- App font. Loaded before styles so text measurements are stable after startup. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap"
        rel="stylesheet">

    <!-- Leaflet base styles must load before app overrides. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App styles. Order matters: base layout first, touch and mobile overrides last. -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/panel.css" />
    <link rel="stylesheet" href="css/content.css" />
    <link rel="stylesheet" href="css/location.css" />
    <link rel="stylesheet" href="css/controls.css" />
    <link rel="stylesheet" href="css/leaflet-overrides.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/touch.css" />
    <link rel="stylesheet" href="css/mobile.css" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Photo geolocator</title>
</head>

<body>
    <!-- Apply dark mode immediately to avoid a light-theme flash before JS startup finishes. -->
    <script>try { if (localStorage.getItem("isDark") !== "false") document.body.classList.add("dark"); } catch (e) { }</script>

    <!-- Leaflet owns this element after main.js creates the map. -->
    <div id="map"></div>

    <!--
        Inline sprite used by the searching globe animation.
        Defining it once keeps the animated instances lightweight.
    -->
    <svg aria-hidden="true" class="svg-sprite" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <symbol id="icon-world" viewBox="0 0 216 100">
                <title>world</title>
                <g fill-rule="nonzero">
                    <path
                        d="M48 94l-3-4-2-14c0-3-1-5-3-8-4-5-6-9-4-11l1-4 1-3c2-1 9 0 11 1l3 2 2 3 1 2 8 2c1 1 2 2 0 7-1 5-2 7-4 7l-2 3-2 4-2 3-2 1c-2 2-2 9 0 10v1l-3-2zM188 90l3-2h1l-4 2zM176 87h2l-1 1-1-1zM195 86l3-2-2 2h-1zM175 83l-1-2-2-1-6 1c-5 1-5 1-5-2l1-4 2-2 4-3c5-4 9-5 9-3 0 3 3 3 4 1s1-2 1 0l3 4c2 4 1 6-2 10-4 3-7 4-8 1zM100 80c-2-4-4-11-3-14l-1-6c-1-1-2-3-1-4 0-2-4-3-9-3-4 0-5 0-7-3-1-2-2-4-1-7l3-6 3-3c1-2 10-4 11-2l6 3 5-1c3 1 4 0 5-1s-1-2-2-2l-4-1c0-1 3-3 6-2 3 0 3 0 2-2-2-2-6-2-7 0l-2 2-1 2-3-2-3-3c-1 0-1 1 1 2l1 2-2-1c-4-3-6-2-8 1-2 2-4 3-5 1-1-1 0-4 2-4l2-2 1-2 3-2 3-2 2 1c3 0 7-3 5-4l-1-3h-1l-1 3-2 2h-1l-2-1c-2-1-2-1 1-4 5-4 6-4 11-3 4 1 4 1 2 2v1l3-1 6-1c5 0 6-1 5-2l2 1c1 2 2 2 2 1-2-4 12-7 14-4l11 1 29 3 1 2-3 3c-2 0-2 0-1 1l1 3h-2c-1-1-2-3-1-4h-4l-6 2c-1 1-1 1 2 2 3 2 4 6 1 8v3c1 3 0 3-3 0s-4-1-2 3c3 4 3 7-2 8-5 2-4 1-2 5 2 3 0 5-3 4l-2-1-2-2-1-1-1-1-2-2c-1-2-1-2-4 0-2 1-3 4-3 5-1 3-1 3-3 1l-2-4c0-2-1-3-2-3l-1-1-4-2-6-1-4-2c-1 1 3 4 5 4h2c1 1 0 2-1 4-3 2-7 4-8 3l-7-10 5 10c2 2 3 3 5 2 3 0 2 1-2 7-4 4-4 5-4 8 1 3 1 4-1 6l-2 3c0 2-6 9-8 9l-3-2zm22-51l-2-3-1-1v-1c-2 0-2 2-1 4 2 3 4 4 4 1z" />
                    <path
                        d="M117 75c-1-2 0-6 2-7h2l-2 5c0 2-1 3-2 1zM186 64h-3c-2 0-6-3-5-5 1-1 6 1 7 3l2 3-2-1zM160 62h2c1 1 0 1-1 1l-1-1zM154 57l-1-2c2 2 3 1 2-2l-2-3 2 2 1 4 1 3v2l-3-4zM161 59c-1-1-1-2 1-4 3-3 4-3 4 0 0 4-2 6-5 4zM167 59l1-1 1 1-1 1-1-1zM176 59l1-1v2l-1-1zM141 52l1-1v2l-1-1zM170 52l1-1v2l-1-1zM32 50c-1-2-4-3-6-4-4-1-5-3-7-6l-3-5-2-2c-1-3-1-6 2-9 1-1 2-3 1-5 0-4-3-5-8-4H4l2-2 1-1 1-1 2-1c1-2 7-2 23-1 12 1 12 1 12-1h1c1 1 2 2 3 1l1 1-3 1c-2 0-8 4-8 5l2 1 2 3 4-3c3-4 4-4 5-3l3 1 1 2 1 2c3 0-1 2-4 2-2 0-2 0-2 2 1 1 0 2-2 2-4 1-12 9-12 12 0 2 0 2-1 1 0-2-2-3-6-2-3 0-4 1-4 3-2 4 0 6 3 4 3-1 3-1 2 1s-1 2 1 2l1 2 1 3 1 1-3-2zm8-24l1-1c0-1-4-3-5-2l1 1v2c-1 1-1 1 0 0h3zM167 47v-3l1 2c1 2 0 3-1 1z" />
                    <path
                        d="M41 43h2l-1 1-1-1zM37 42v-1l2 1h-2zM16 38l1-1v2l-1-1zM172 32l2-3h1c1 2 0 4-3 4v-1zM173 26h2l-1 1-1-1zM56 22h2l-2 1v-1zM87 19l1-2 1 3-1 1-1-2zM85 19l1-1v1l-1 1v-1zM64 12l1-3c2 0-1-4-3-4s-2 0 0-1V3l-6 2c-3 1-3 1-2-1 2-1 4-2 15-2h14c0 2-6 7-10 9l-5 2-2 1-2-2zM53 12l1-1c2 0-1-3-3-3-2-1-1-1 1-1l4 2c2 1 2 1 1 3-2 1-4 2-4 0zM80 12l1-1 1 1-1 1-1-1zM36 8h-2V7c1-1 7 0 7 1h-5zM116 7l1-1v1l-1 1V7zM50 5h2l-1 1-1-1zM97 5l2-1c0-1 1-1 0 0l-2 1z" />
                </g>
            </symbol>

            <symbol id="icon-repeated-world" viewBox="0 0 432 100">
                <use href="#icon-world" x="0"></use>
                <use href="#icon-world" x="189"></use>
            </symbol>
        </defs>
    </svg>

    <!--
        Main landing UI.
        JS swaps between welcome, loading, and error states depending on the current search.
    -->
    <div id="wrapper">

        <div id="noData" class="box"></div>

        <div id="searching" class="box">
            <span id="searchingGlobe" class="world">
                <span class="world-images">
                    <svg aria-hidden="true">
                        <use href="#icon-repeated-world"></use>
                    </svg>
                </span>
            </span>
            <span id="searchingText"> Identifying
                location...</span>
        </div>

        <div id="welcome" class="box"></div>

        <!-- Hidden file input. The visible labels below trigger this same input. -->
        <input type="file" id="imageInput">
        <label for="imageInput" id="imageInputLabel" class="box">Upload photo</label>

    </div>

    <!-- Desktop locate button. The mobile version lives with the compact controls below. -->
    <button id="locateUserButton" class="box desktop-toggle-label" aria-label="Use my location">⌖</button>

    <!-- One-time hint shown when the locate-user feature first becomes available. -->
    <div id="locateUserHint" class="box">
        <span class="hint-arrow hint-arrow-left">←</span>
        <span class="hint-text"></span>
        <span class="hint-arrow hint-arrow-right">→</span>
    </div>

    <!--
        Top-right controls.
        Each dropdown has a trigger and a hidden option panel controlled by ui.js.
    -->
    <div id="wrapperToggles">
        <div id="wrapperView">
            <button id="showToggleView" class="box">
                <span class="desktop-toggle-label toggle-text">View</span>
                <span class="toggle-chevron"></span>
            </button>

            <button id="toggleView" class="hidden-view box">
                <span class="desktop-toggle-label">Satellite</span>
                <span class="mobile-toggle-label"></span>
            </button>
        </div>

        <div id="wrapperTheme">
            <button id="showToggleTheme" class="box">
                <span class="desktop-toggle-label toggle-text">Theme</span>
                <span class="toggle-chevron"></span>
            </button>

            <button id="toggleTheme" class="hidden-theme box">
                <span class="desktop-toggle-label">Dark</span>
                <span class="mobile-toggle-label"></span>
            </button>
        </div>

        <div id="wrapperLanguage">
            <button id="showToggleLanguage" class="box">
                <span class="desktop-toggle-label toggle-text">Language</span>
                <span class="mobile-toggle-label"></span>
                <span class="toggle-chevron"></span>
            </button>

            <div id="languageOptions" class="hidden-language">

                <button class="lang-option box" data-lang="en">English</button>

                <button class="lang-option box" data-lang="ar">العربية</button>
                <button class="lang-option box" data-lang="bg">Български</button>
                <button class="lang-option box" data-lang="bn">বাংলা</button>
                <button class="lang-option box" data-lang="cs">Čeština</button>
                <button class="lang-option box" data-lang="da">Dansk</button>
                <button class="lang-option box" data-lang="de">Deutsch</button>
                <button class="lang-option box" data-lang="el">Ελληνικά</button>
                <button class="lang-option box" data-lang="es">Español</button>
                <button class="lang-option box" data-lang="et">Eesti</button>
                <button class="lang-option box" data-lang="fa">فارسی</button>
                <button class="lang-option box" data-lang="fi">Suomi</button>
                <button class="lang-option box" data-lang="fr">Français</button>
                <button class="lang-option box" data-lang="he">עברית</button>
                <button class="lang-option box" data-lang="hi">हिन्दी</button>
                <button class="lang-option box" data-lang="hr">Hrvatski</button>
                <button class="lang-option box" data-lang="hu">Magyar</button>
                <button class="lang-option box" data-lang="id">Indonesia</button>
                <button class="lang-option box" data-lang="is">Íslenska</button>
                <button class="lang-option box" data-lang="it">Italiano</button>
                <button class="lang-option box" data-lang="ja">日本語</button>
                <button class="lang-option box" data-lang="ko">한국어</button>
                <button class="lang-option box" data-lang="lt">Lietuvių</button>
                <button class="lang-option box" data-lang="lv">Latviešu</button>
                <button class="lang-option box" data-lang="nl">Nederlands</button>
                <button class="lang-option box" data-lang="no">Norsk</button>
                <button class="lang-option box" data-lang="pl">Polski</button>
                <button class="lang-option box" data-lang="pt">Português</button>
                <button class="lang-option box" data-lang="ro">Română</button>
                <button class="lang-option box" data-lang="ru">Русский</button>
                <button class="lang-option box" data-lang="sk">Slovenčina</button>
                <button class="lang-option box" data-lang="sl">Slovenščina</button>
                <button class="lang-option box" data-lang="sr">Српски</button>
                <button class="lang-option box" data-lang="sv">Svenska</button>
                <button class="lang-option box" data-lang="ta">தமிழ்</button>
                <button class="lang-option box" data-lang="th">ไทย</button>
                <button class="lang-option box" data-lang="tr">Türkçe</button>
                <button class="lang-option box" data-lang="uk">Українська</button>
                <button class="lang-option box" data-lang="ur">اردو</button>
                <button class="lang-option box" data-lang="vi">Tiếng Việt</button>
                <button class="lang-option box" data-lang="zh">中文</button>

            </div>
        </div>

        <!-- Compact controls shown on mobile or small viewports. -->
        <label for="imageInput" id="imageInputLabelPanel" class="box mobile-control-only">
            <svg class="upload-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                    d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21" />
                <path d="m14 19.5 3-3 3 3" />
                <path d="M17 22v-5.5" />
                <circle cx="9" cy="9" r="2" />
            </svg>
        </label>

        <button id="locateUserButtonMobile" class="box mobile-control-only" aria-label="Use my location">
            <svg class="locate-mobile-icon" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="2" x2="5" y1="12" y2="12" />
                <line x1="19" x2="22" y1="12" y2="12" />
                <line x1="12" x2="12" y1="2" y2="5" />
                <line x1="12" x2="12" y1="19" y2="22" />
                <circle cx="12" cy="12" r="7" />
                <circle cx="12" cy="12" r="3" />
            </svg>
        </button>
    </div>

    <!--
        Full result panel.
        panel.js controls its states: open, closed, minimized strip, and ultra on touch devices.
    -->
    <div id="resultPanel">
        <!-- Touch drag handle. Hidden or decorative depending on layout. -->
        <div id="panelHandle" aria-hidden="true">
            <span class="handle-chevron handle-chevron-up">
                <svg viewBox="0 0 24 8">
                    <polyline points="2,7 12,1 22,7" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
            <span class="handle-line"></span>
            <span class="handle-chevron handle-chevron-down">
                <svg viewBox="0 0 24 8">
                    <polyline points="2,1 12,7 22,1" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
        </div>
        <button id="panelClose">✕</button>

        <!-- Result content is filled dynamically after EXIF or AI search. -->
        <div id="panelContent">
            <div id="panelPhoto"></div>
            <div id="placeNameWithGlobe">
                <span id="panelSearchingGlobe" class="world">
                    <span class="world-images">
                        <svg aria-hidden="true">
                            <use href="#icon-repeated-world"></use>
                        </svg>
                    </span>
                </span>
                <span id="panelPlaceName"></span>
            </div>
            <div id="panelMethod"></div>
            <button id="learnMore">
                <span class="learn-more-text">En savoir plus</span>
                <span class="learn-more-arrow"></span>
            </button>

            <!-- Optional extra content. It stays collapsed until a wiki or geo card exists. -->
            <div id="moreContent" class="collapsed">
                <!-- Geo cards are reused and filled individually by geoinfo.js. -->
                <div id="panelGeoInfo">
                    <div id="country">
                        <div class="icon"></div>
                        <div class="value"></div>
                        <div class="continent"></div>
                    </div>
                    <div id="coordinates">
                        <div class="icon"></div>
                        <div class="value"></div>
                    </div>

                    <div id="altitude">
                        <div class="icon"></div>
                        <div class="value"></div>
                    </div>

                    <div id="distance">
                        <div class="icon"></div>
                        <div class="value"></div>
                    </div>

                    <div id="weather">
                        <div class="icon"></div>
                        <div class="value"></div>
                    </div>
                    <div id="time">
                        <div class="icon"></div>
                        <div class="value"></div>
                    </div>
                </div>
                <button id="toggleUnits">⇌</button>
                <!-- Wikipedia excerpt inserted by wiki.js when an article is found. -->
                <div id="panelWiki"></div>
            </div>
        </div>
        <button id="panelToggle">
            <span class="chevron chevron-left"></span>
            <span class="chevron chevron-down"></span>
        </button>
    </div>

    <!--
        Minimized result strip.
        It keeps the current result available while giving the map most of the screen back.
    -->
    <div id="resultStrip" class="box">
        <div id="stripHandle" aria-hidden="true">
            <span class="handle-chevron handle-chevron-up">
                <svg viewBox="0 0 24 8">
                    <polyline points="2,7 12,1 22,7" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
            <span class="handle-line"></span>
        </div>
        <button id="stripClose">✕</button>

        <div id="stripPlaceName"></div>

        <button id="stripToggle">
            <span class="chevron chevron-right"></span>
            <span class="chevron chevron-up"></span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!--
        App scripts.
        Order matters because these are plain global scripts, not ES modules.
        dom.js defines shared element references, main.js runs last and starts the app.
    -->
    <script src="js/dom.js"></script>
    <script src="js/languages.js"></script>
    <script src="js/config.js"></script>
    <script src="js/state.js"></script>

    <script src="js/touch.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/geocoding.js"></script>
    <script src="js/wiki.js"></script>
    <script src="js/geoinfo.js"></script>
    <script src="js/location.js"></script>
    <script src="js/locator.js"></script>

    <script src="js/main.js"></script>

</body>

</html>
