<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <title>🌍 Photo geolocator</title>
    <style>
    * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
    }

    body {
         overflow: hidden;
    }

    #map {
         height: 100vh;
         height: 100dvh;
    }

    #imageInput {
    display:none;
    }

    #wrapper {
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:1000;
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:stretch;
    width:250px;
    }

    #welcome {
    max-width: 250px;
    text-align: center;
    font-size: 0.9rem;
    }

    #closeResult {
    min-height: 44px;
    font-size: 1rem;
    display: none;
    width: 100%;
    font-family:'DM Sans',sans-serif;
    }

    #imageInputLabel {
    font-weight:bold;
    cursor:pointer;
    min-height:44px;
    display:flex;
    align-items:center;
    width: 100%;
    justify-content: center;
    }

    .leaflet-popup-content {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    text-align: center;
    }

    .box, .leaflet-control-zoom a  {
    background: rgba(255,255,255,0.3);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 10px;
    padding:6px 14px;
    font-family:'DM Sans',sans-serif;
    }

    #noData {
    font-weight:bold;
    text-align: center;
    display:none;
    }

    #wrapperToggles {
    position:absolute;
    top:14px;
    right:14px;
    z-index: 1000;
    display:flex;
    flex-direction:column;
    gap:6px;
    align-items:stretch;
    width:94px;
    }

    #wrapperView, #wrapperTheme {
    display:flex;
    flex-direction:column;
    gap:0px;
    }

    #viewToggleView, #viewToggleTheme {
    font-weight:bold;
    }

    .hidden-view { 
    display: none;
    }

    .hidden-theme { 
    display: none;
    }

    .leaflet-control-zoom a {
    padding:0 0;
    border-radius: 0 !important;
    border-bottom: 1px solid rgba(0,0,0,0.1) !important;
    box-shadow: none !important;
    }

    .leaflet-control-zoom-in {
    border-radius: 10px 10px 0 0 !important;
    }

    .leaflet-control-zoom-out {
    border-radius: 0 0 10px 10px !important;
    border-bottom: none !important;
    }

    .leaflet-control-zoom {
    margin-top: 14px;
    margin-left: 14px;
    border: none !important;
    border-radius: 10px !important;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3) !important;
    }

    .leaflet-popup-content-wrapper {
    background: rgba(255,255,255,0.3) !important;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3) !important;
    border: 1px solid rgba(0,0,0,0.15) !important;
    border-radius: 10px !important;
    }

    .leaflet-popup-tip {
    background: rgba(255,255,255,0.85) !important;
    }

    .leaflet-control-attribution {
    background: rgba(255,255,255,0.3) !important;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #000;
    font-size: 0.7rem;
    border-radius: 6px 0 0 0;
    }

    #searchingGlobe {
    display: inline-block;
    }

    .globe-active {
    animation: spin 1.5s linear infinite;
    }

    #searching {
    text-align: center;
    display: none;
    }

    .searching-active {
    animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
    }

    @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
    }
    </style>
</head>
<body>
    <div id="map"></div> 

    <div id="wrapper">
        
        <button id="closeResult" class="box">Close result</button>

        <div id="noData" class="box"></div>

        <div id="searching" class="box"><span id="searchingGlobe">🌍</span> Identifying location...</div>
       
        <div id="welcome" class="box"></div>
        
        <input type="file" id="imageInput">
        <label for="imageInput" id="imageInputLabel" class="box">Upload photo</label>

    </div>
    <div id="wrapperToggles">
        <div id="wrapperView">
            <button id="viewToggleView" class="box">View ▼</button>
            <button id="toggleLayer" class="hidden-view box">Satellite</button>
        </div>
        <div id="wrapperTheme">
            <button id="viewToggleTheme" class="box">Theme ▼</button>
            <button id="toggleTheme" class="hidden-theme box">Dark</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        var isAndroid = /Android/i.test(navigator.userAgent);
        var isFirefox = /Firefox/i.test(navigator.userAgent);

        if (/SamsungBrowser/.test(navigator.userAgent)) {
            document.getElementById("welcome").textContent = "Welcome! Upload a photo to identify where it was taken. ⚠️ Please open this page in Chrome for full functionality.";
        } else if (isAndroid && isFirefox) {
            document.getElementById("welcome").textContent = "Welcome! Upload a photo to identify where it was taken. ⚠️ Firefox on Android doesn't support location data. Try Chrome or desktop for best results.";
        } else {
            document.getElementById("welcome").textContent = "Welcome! Upload a photo to identify where it was taken.";
        }

        var fileInput = document.getElementById('imageInput');
        if (/Android/i.test(navigator.userAgent)) {
            fileInput.accept = 'image/*,model/gltf+json';
        } else {
            fileInput.accept = 'image/*';
        }

        var map = L.map('map').setView([0, 0], 2);

        var streetLayerLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap © CARTO'
        });

        var streetLayerDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap © CARTO'
        });

        var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: '© Esri'
        });

        map.attributionControl.setPrefix('© A.G.');

        streetLayerLight.addTo(map);
        var isSatellite = false;
        var isDark = false;

        var darkPopupStyle = document.createElement("style");
        darkPopupStyle.textContent = `
            .leaflet-popup-content-wrapper {
                background: rgba(15, 15, 25, 0.6) !important;
                color: #f0f0f0 !important;
                box-shadow: 0 2px 12px rgba(0,0,0,0.5) !important;
            }
            .leaflet-popup-tip {
                background: rgba(15, 15, 25, 0.6) !important;
            }
        `;

        document.getElementById("viewToggleView").addEventListener("click", function() {
            if (!document.getElementById("toggleTheme").classList.contains("hidden-theme")) {
                document.getElementById("toggleTheme").classList.add("hidden-theme");
                document.getElementById("viewToggleTheme").textContent = "Theme ▼";
            }
            document.getElementById("toggleLayer").classList.toggle("hidden-view");
            this.textContent = this.textContent === "View ▼" ? "View ▲" : "View ▼";
        });

        document.getElementById("toggleLayer").addEventListener("click", function() {
            
            if (!document.getElementById("toggleTheme").classList.contains("hidden-theme")) {
                document.getElementById("toggleTheme").classList.add("hidden-theme");
                document.getElementById("viewToggleTheme").textContent = "Theme ▼";
            }

            if (isSatellite) {
                map.removeLayer(satelliteLayer);
                if (isDark) {
                    streetLayerDark.addTo(map);
                }
                else {
                    streetLayerLight.addTo(map);
                }
                this.textContent = "Satellite";
                isSatellite = false;
            } else {
                if (isDark) {
                    map.removeLayer(streetLayerDark);
                }
                else {
                    map.removeLayer(streetLayerLight);
                }
                satelliteLayer.addTo(map);
                this.textContent = "Street";
                isSatellite = true;
            }
            this.classList.toggle("hidden-view");
            document.getElementById("viewToggleView").textContent="View ▼";
        });

        function toDarkTheme () {

            const elements = document.getElementsByClassName("box");

            for (let el of elements) {
              el.style.background = "rgba(15, 15, 25, 0.75)";
              el.style.color = "#f0f0f0";
              el.style.border = "1px solid rgba(255, 255, 255, 0.12)";
              el.style.boxShadow = "0 2px 12px rgba(0, 0, 0, 0.5)";
            }

            var zoomButtons = document.querySelectorAll(".leaflet-control-zoom a");

            zoomButtons.forEach(function(el) {
              el.style.background = "rgba(15, 15, 25, 0.75)";
              el.style.color = "#f0f0f0";
              el.style.border = "1px solid rgba(255, 255, 255, 0.12)";
              el.style.boxShadow = "0 2px 12px rgba(0, 0, 0, 0.5)";
            });

            document.head.appendChild(darkPopupStyle);

            document.querySelector(".leaflet-control-attribution").style.background = "rgba(15,15,25,0.75)";
            document.querySelector(".leaflet-control-attribution").style.color = "#f0f0f0";

            if (photoMarker) photoMarker.setIcon(cameraIconDark);
        }

        function toLightTheme () {
            const elements = document.getElementsByClassName("box");

            for (let el of elements) {
              el.style.background = "rgba(255,255,255,0.4)";
              el.style.color = "#000000";
              el.style.border = "1px solid rgba(0,0,0,0.15)";
              el.style.boxShadow = "0 2px 8px rgba(0,0,0,0.3)";
            }

            var zoomButtons = document.querySelectorAll(".leaflet-control-zoom a");

            zoomButtons.forEach(function(el) {
              el.style.background = "rgba(255,255,255,0.4)";
              el.style.color = "#000000";
              el.style.border = "1px solid rgba(0,0,0,0.15)";
              el.style.boxShadow = "0 2px 8px rgba(0,0,0,0.3)";
            });

            darkPopupStyle.remove();

            document.querySelector(".leaflet-control-attribution").style.background = "rgba(255,255,255,0.4)";
            document.querySelector(".leaflet-control-attribution").style.color = "#000";

            if (photoMarker) photoMarker.setIcon(cameraIconLight);
        }


        document.getElementById("viewToggleTheme").addEventListener("click", function() {
            if (!document.getElementById("toggleLayer").classList.contains("hidden-view")) {
                document.getElementById("toggleLayer").classList.add("hidden-view");
                document.getElementById("viewToggleView").textContent = "View ▼";
            }
            document.getElementById("toggleTheme").classList.toggle("hidden-theme");
            this.textContent = this.textContent === "Theme ▼" ? "Theme ▲" : "Theme ▼";
        });
        
        document.getElementById("toggleTheme").addEventListener("click", function() {
            if (isDark) {
                toLightTheme();
                this.textContent = "Dark";
                isDark = false;
                if (!isSatellite){
                    map.removeLayer(streetLayerDark);
                    streetLayerLight.addTo(map);
                }
            } else {
                toDarkTheme();
                this.textContent = "Light";
                isDark = true;
                if (!isSatellite) {
                    map.removeLayer(streetLayerLight);
                    streetLayerDark.addTo(map);
                }
            }
            this.classList.toggle("hidden-theme");
            document.getElementById("viewToggleTheme").textContent="Theme ▼";
        });



        map.on("click", function() {
            if (!document.getElementById("toggleLayer").classList.contains("hidden-view")) {
                document.getElementById("toggleLayer").classList.add("hidden-view");
                document.getElementById("viewToggleView").textContent = "View ▼";
            }
            if (!document.getElementById("toggleTheme").classList.contains("hidden-theme")) {
                document.getElementById("toggleTheme").classList.add("hidden-theme");
                document.getElementById("viewToggleTheme").textContent = "Theme ▼";
            }
        });

        var cameraIconLight = new L.Icon({
         iconUrl: 'https://antonin-gg.github.io/geolocator/cameraIconLight.png',
         shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
         iconSize: [31, 41],
         iconAnchor: [15, 41],
         popupAnchor: [1, -41],
         shadowSize: [41, 41]
        });

        var cameraIconDark = new L.Icon({
         iconUrl: 'https://antonin-gg.github.io/geolocator/cameraIconDark.png',
         shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
         iconSize: [31, 41],
         iconAnchor: [15, 41],
         popupAnchor: [1, -41],
         shadowSize: [41, 41]
        });

        var photoMarker;

        async function aiLocator (image){

            var imageBase64 = await new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(e) { resolve(e.target.result); };
                reader.readAsDataURL(image);
            });

            var aiResponse = await fetch("https://geolocator-ai.guyette-anto.workers.dev", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    max_tokens: 200,
                    messages: [{
                        role: "user",
                        content: [
                            {
                                type: "text",
                                text: "Look at this image and identify where in the world it was taken.\n\nRespond with ONLY a JSON object in this exact format, nothing else:\n{\n  \"place\": \"the most specific location name you can identify\",\n  \"confidence\": \"landmark\" | \"area\" | \"city\" | \"country\" | \"unknown\"\n}\n\nABSOLUTE RULE — check this first before anything else: If the image is not a real photograph taken by a camera in the real world — this includes cartoons, illustrations, paintings, drawings, sketches, AI-generated images, screenshots, or any non-photographic image — you MUST set confidence to \"unknown\" and place to \"unknown\". This rule cannot be overridden by any other consideration.\n\nEvidence rules — apply before identifying any location:\n- Prioritize unique, explicit, low-frequency clues: flags, language, script, signage, license plates, road markings, architecture, culturally specific objects.\n- Treat terrain and landscape as WEAK evidence unless combined with unique identifiers.\n- Do NOT rely on visual similarity or vibe. Avoid bias toward overrepresented regions (USA, Western Europe) without explicit evidence.\n- If a rare or region-specific clue is present, it overrides generic landscape similarity.\n- Consider at least 2–3 candidate locations internally before deciding. Include non-Western candidates when the scene is generic.\n- Actively eliminate candidates that conflict with any visible detail.\n\nIdentification rules:\n- Use \"landmark\" only for a specific, unmistakable real-world landmark. Include full name, city and country (e.g. \"Eiffel Tower, Paris, France\").\n- Use \"area\" only for a specific town, village or neighbourhood with high certainty. Include region and country to avoid ambiguity (e.g. \"Reine, Nordland, Norway\" or \"Tabatinga, Amazonas, Brazil\").\n- Use \"city\" only for a major, internationally recognisable city with very high certainty. Refer to the city specifically, not its state or region (e.g. \"Rio de Janeiro city, Brazil\"). Include state if the name is ambiguous (e.g. \"Portland, Oregon, USA\").\n- Use \"country\" only if the country is identifiable with high certainty but nothing more specific.\n- Use \"unknown\" if: evidence is weak or generic, multiple locations remain plausible, or any visible detail is inconsistent with the chosen answer.\n\nFinal check — MANDATORY before returning your answer:\n- Ask internally: what is the strongest piece of evidence, and does it uniquely support this location?\n- If the answer depends mainly on generic features, or if any alternative location is plausible, return \"unknown\".\n\nNEVER GUESS. A wrong answer is worse than no answer.\n\nReturn ONLY the JSON object, no explanation, no markdown."
                            },
                            {
                                type: "image_url",
                                image_url: {
                                    url: imageBase64,
                                    detail: "high"
                                }
                            }
                        ]
                    }]
                })
            });

            var data = await aiResponse.json();
            var raw = data.choices[0].message.content;
            var clean = raw.replace(/```json|```/g, "").trim();
            try {
                return JSON.parse(clean);
            } catch(e) {
                return { place: "unknown", confidence: "unknown" };
            }

        }

        async function showImage (input) {

            var image = input.files[0];

            if (!image || !image.type.startsWith('image/')) {
                document.getElementById("noData").style.display = "block";
                document.getElementById("noData").textContent = "Please upload an image file.";
                setTimeout(() => {
                    document.getElementById("noData").style.display = "none";
                }, 3000);
                return;
            }

            var photoImgSrc = URL.createObjectURL(image);
            var photoImgHtml = '<img src="' + photoImgSrc + '" style="max-width:200px;width:100%;border-radius:4px;margin-top:6px;">';
            
            var photoLatLng = await exifr.gps(image);
            
            if (photoLatLng && photoLatLng.latitude && photoLatLng.longitude) {

                if (photoMarker) map.removeLayer(photoMarker);

                async function getPlaceName() {
                    var response = await fetch("https://api.opencagedata.com/geocode/v1/json?q="+encodeURIComponent(photoLatLng.latitude+","+photoLatLng.longitude)+"&key=49b47c25108242779832267ff8062473");
                    var data = await response.json();
                
                    var placeName = data.results.length > 0 ? data.results[0].formatted : "Unknown location";

                    var photoPopup = L.popup().setContent("This photo was taken in " + placeName + ".<br>"+ photoImgHtml);

                    photoMarker = L.marker([photoLatLng.latitude, photoLatLng.longitude],{icon: isDark ? cameraIconDark : cameraIconLight}).addTo(map);

                    map.flyTo([photoLatLng.latitude, photoLatLng.longitude], 13);

                    document.getElementById("closeResult").style.display = "block";

                    document.getElementById("welcome").style.display = "none";

                    map.once("moveend",function(){       
                        photoMarker.bindPopup(photoPopup).openPopup();         
                    });


                }
                getPlaceName();

            }
            else {

                document.getElementById("searching").style.display = "block";
                document.getElementById("searching").classList.add("searching-active");
                document.getElementById("searchingGlobe").classList.add("globe-active");
                document.getElementById("welcome").style.display = "none";

                var aiResult = await aiLocator(image);

                var aiLocation = aiResult.place;

                if (aiLocation == "unknown"){

                    document.getElementById("searching").style.display = "none";
                    document.getElementById("searching").classList.remove("searching-active");
                    document.getElementById("searchingGlobe").classList.remove("globe-active");

                    if (photoMarker) document.getElementById("closeResult").click();

                    document.getElementById("welcome").style.display="none";
                    document.getElementById("noData").style.display = "block";
                    document.getElementById("noData").textContent = "The location of this photo is unknown"
                    setTimeout(() => {
                     document.getElementById("noData").style.display="none";
                     document.getElementById("noData").textContent=null;
                     document.getElementById("welcome").style.display="block";
                    }, 3000);

                }
                else {
                    if (photoMarker) map.removeLayer(photoMarker);

                    var queryLocation = aiLocation.replace(/\bcity\b,?\s*/i, "");
                    var response = await fetch("https://api.opencagedata.com/geocode/v1/json?q="+encodeURIComponent(queryLocation)+"&key=49b47c25108242779832267ff8062473");
                    var data = await response.json();

                    document.getElementById("searching").style.display = "none";
                    document.getElementById("searching").classList.remove("searching-active");
                    document.getElementById("searchingGlobe").classList.remove("globe-active");

                    if (data.results.length==0){

                        if (photoMarker) document.getElementById("closeResult").click();
                        document.getElementById("welcome").style.display="none";
                        document.getElementById("noData").style.display = "block";
                        document.getElementById("noData").textContent = "The location of this photo is unknown"
                        setTimeout(() => {
                            document.getElementById("noData").style.display="none";
                            document.getElementById("noData").textContent=null;
                            document.getElementById("welcome").style.display="block";
                        }, 3000);
                        return;

                    }

                    var result;
                    if (aiResult.confidence === "city" || aiResult.confidence === "area") {
                        var cityResult = data.results.find(function(r) {
                            return r.components._type === "city" || r.components._type === "town";
                        });
                        result = cityResult || data.results[0];
                    } else {
                    result = data.results[0];
                    }

                    var components = result.components;
                    var city = components.city || components.town || components.village || components.county || "";
                    var country = components.country || "";
                    var displayName = city && country ? city + ", " + country : result.formatted;

                    var lat = result.geometry.lat;
                    var lng = result.geometry.lng;

                    var photoPopup = L.popup().setContent("This photo was taken in " + displayName + ".<br>" + photoImgHtml);

                    var zoomLevel;
                    var geocodedType = result.components._type;

                    if (geocodedType === "attraction" || geocodedType === "place_of_worship" || geocodedType === "building") {
                        zoomLevel = 16;
                    } else if (geocodedType === "city" || geocodedType === "town") {
                        zoomLevel = 11;
                    } else if (geocodedType === "village" || geocodedType === "suburb" || geocodedType === "neighbourhood") {
                        zoomLevel = 13;
                    } else if (geocodedType === "country") {
                        zoomLevel = 5;
                    } else {
                        if (aiResult.confidence === "landmark") zoomLevel = 15;
                        else if (aiResult.confidence === "area") zoomLevel = 13;
                        else if (aiResult.confidence === "city") zoomLevel = 11;
                        else if (aiResult.confidence === "country") zoomLevel = 5;
                        else zoomLevel = 10;
                    }

                    photoMarker = L.marker([lat, lng],{icon: isDark ? cameraIconDark : cameraIconLight}).addTo(map);

                    map.flyTo([lat, lng], zoomLevel);

                    document.getElementById("closeResult").style.display = "block";

                    document.getElementById("welcome").style.display = "none";

                    map.once("moveend",function(){       
                        photoMarker.bindPopup(photoPopup).openPopup();         
                    });

                    
                }
            }
        }

        document.getElementById("imageInput").addEventListener("change",function(e){showImage(e.target)});

        function onCloseClick() {
            map.removeLayer(photoMarker);
            document.getElementById("closeResult").style.display="none";
            document.getElementById("welcome").style.display="block";
        }

        document.getElementById("closeResult").addEventListener("click",onCloseClick);

    </script>
    
</body>
</html>
